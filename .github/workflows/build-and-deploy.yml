name: Build & deploy site

# Rebuilds corpus.json/glossary.json from glossary.tsv + the python-docs-fa
# .po files, then rebuilds the static site from site/{index.html,style.css,app.js,assets/}
# + data/*.json, and deploys to GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "site/**"
      - "scripts/**"
      - ".github/workflows/build-and-deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Check out python-docs-fa
        uses: actions/checkout@v4
        with:
          repository: python/python-docs-fa
          path: python-docs-fa

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install polib

      - name: Build corpus & glossary data
        run: |
          python scripts/build_corpus.py \
            --repo-dir python-docs-fa \
            --glossary-tsv glossary/glossary.tsv \
            --out-dir data

      - name: Build site
        run: |
          python scripts/build_site.py \
            --site-dir site \
            --data-dir data \
            --out-dir dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4